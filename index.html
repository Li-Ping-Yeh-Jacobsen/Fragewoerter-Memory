<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Woche 8: W-Fragen Memory (问句与回答配对游戏)</title>
<style>
  :root {
    --navy: #1f4e79;
    --teal: #1e6b52;
    --crimson: #9e1b1b;
    --amber: #d97706;
    --bg: #f4f7fa;
    --card-back: #1f4e79;
    --text: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Times New Roman", Georgia, serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .zh {
    font-family: "DFKai-SB", "BiauKai", "標楷體", "KaiTi", serif;
  }
  .py {
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
  }
  header {
    background: linear-gradient(135deg, var(--navy), #163a5c);
    color: #fff;
    padding: 12px 22px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  header h1 {
    margin: 0;
    font-size: 1.3rem;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 8px 13px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toggle-btn {
    background: #e2e8f0;
    color: var(--text);
  }
  .toggle-btn.on {
    background: var(--teal);
    color: #fff;
  }
  .action-btn {
    background: var(--crimson);
    color: #fff;
  }
  .action-btn:hover { background: #7f1d1d; }
  .peek-btn {
    background: var(--amber);
    color: #fff;
  }
  main {
    flex: 1;
    max-width: 1120px;
    width: 100%;
    margin: 14px auto;
    padding: 0 16px;
  }
  .status-bar {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .status-msg {
    font-weight: bold;
    color: var(--navy);
    font-size: 1rem;
  }
  .stats {
    display: flex;
    gap: 14px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .stats strong { color: var(--crimson); }

  /* 4x3 Grid for 12 cards (6 pairs) */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 820px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    perspective: 900px;
    height: 152px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    box-shadow: 0 3px 10px rgba(15,23,42,0.08);
    border: 2px solid var(--border);
  }
  .card-back {
    background: linear-gradient(135deg, var(--navy), #2b6cb0);
    color: #fff;
    border-color: #1a365d;
  }
  .card-num {
    font-size: 1.8rem;
    font-weight: bold;
    opacity: 0.92;
  }
  .card-sub {
    font-size: 0.85rem;
    opacity: 0.78;
    margin-top: 4px;
  }
  .card-front {
    background: #fff;
    transform: rotateY(180deg);
  }
  .card.type-q .card-front {
    border-top: 6px solid var(--navy);
  }
  .card.type-a .card-front {
    border-top: 6px solid var(--teal);
  }
  .card.matched .card-front {
    background: #ecfdf5;
    border-color: var(--teal);
  }
  .role-pill {
    font-size: 0.75rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .type-q .role-pill {
    background: #e0f2fe;
    color: var(--navy);
  }
  .type-a .role-pill {
    background: #d1fae5;
    color: var(--teal);
  }
  .card-zh {
    font-size: 1.38rem;
    font-weight: bold;
    color: #0f172a;
    line-height: 1.25;
  }
  .card-py {
    font-size: 0.88rem;
    color: var(--teal);
    margin-top: 4px;
  }
  .card-de {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 3px;
  }

  /* Scoreboard Footer */
  footer {
    background: #fff;
    border-top: 2px solid var(--border);
    padding: 10px 20px;
  }
  .scoreboard {
    max-width: 1120px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .team-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f8fafc;
  }
  .team-name {
    font-weight: bold;
    color: var(--navy);
    font-size: 0.92rem;
  }
  .team-score {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--crimson);
    margin: 0 8px;
  }
  .score-btns button {
    background: var(--navy);
    color: #fff;
    width: 25px;
    height: 25px;
    padding: 0;
    border-radius: 6px;
  }
  .score-btns button.minus {
    background: #94a3b8;
  }
  @media (max-width: 680px) {
    .scoreboard { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1><span class="zh">第 8 周翻牌记忆游戏</span> · W-Fragen Memory (Frage &amp; Antwort)</h1>
  <div class="controls">
    <button class="toggle-btn on" id="btnPinyin" onclick="toggleHint('pinyin')">Pīnyīn: AN</button>
    <button class="toggle-btn on" id="btnGerman" onclick="toggleHint('german')">Deutsch: AN</button>
    <button class="peek-btn" onclick="peekAll()">👀 Kurz zeigen (3 Sek.)</button>
    <button class="action-btn" onclick="initGame()">🔄 Neu mischen</button>
  </div>
</header>

<main>
  <div class="status-bar">
    <div class="status-msg" id="statusMsg">Finde die passenden Paare: Frage (问句) + Antwort (回答)!</div>
    <div class="stats">
      <span>Paare: <strong id="pairCount">0 / 6</strong></span>
      <span>Versuche: <strong id="moveCount">0</strong></span>
    </div>
  </div>

  <div class="grid" id="cardGrid"></div>
</main>

<footer>
  <div class="scoreboard">
    <div class="team-box">
      <span class="team-name">Gruppe 1</span>
      <span class="team-score" id="score0">0</span>
      <div class="score-btns">
        <button onclick="addScore(0, 1)">+</button>
        <button class="minus" onclick="addScore(0, -1)">-</button>
      </div>
    </div>
    <div class="team-box">
      <span class="team-name">Gruppe 2</span>
      <span class="team-score" id="score1">0</span>
      <div class="score-btns">
        <button onclick="addScore(1, 1)">+</button>
        <button class="minus" onclick="addScore(1, -1)">-</button>
      </div>
    </div>
    <div class="team-box">
      <span class="team-name">Gruppe 3</span>
      <span class="team-score" id="score2">0</span>
      <div class="score-btns">
        <button onclick="addScore(2, 1)">+</button>
        <button class="minus" onclick="addScore(2, -1)">-</button>
      </div>
    </div>
    <div class="team-box">
      <span class="team-name">Gruppe 4</span>
      <span class="team-score" id="score3">0</span>
      <div class="score-btns">
        <button onclick="addScore(3, 1)">+</button>
        <button class="minus" onclick="addScore(3, -1)">-</button>
      </div>
    </div>
  </div>
</footer>

<script>
  let showPinyin = true;
  let showGerman = true;
  const scores = [0, 0, 0, 0];

  const pairsData = [
    {
      pairId: 1,
      q: { zh: "他 / 她是谁？", py: "Tā shì shéi?", de: "Wer ist er / sie?" },
      a: { zh: "他是我的哥哥。", py: "Tā shì wǒ de gēge.", de: "Er ist mein älterer Bruder." }
    },
    {
      pairId: 2,
      q: { zh: "请问你叫什么名字？", py: "Qǐngwèn nǐ jiào shénme míngzi?", de: "Wie heißt du bitte?" },
      a: { zh: "我叫 Lukas。", py: "Wǒ jiào Lukas.", de: "Ich heiße Lukas." }
    },
    {
      pairId: 3,
      q: { zh: "你是哪国人？", py: "Nǐ shì nǎ guó rén?", de: "Welche Nationalität hast du?" },
      a: { zh: "我是德国人。", py: "Wǒ shì Déguó rén.", de: "Ich bin Deutsche(r)." }
    },
    {
      pairId: 4,
      q: { zh: "你几岁？ / 你多大？", py: "Nǐ jǐ suì? / Nǐ duōdà?", de: "Wie alt bist du?" },
      a: { zh: "我十二岁。", py: "Wǒ shí'èr suì.", de: "Ich bin 12 Jahre alt." }
    },
    {
      pairId: 5,
      q: { zh: "你读什么学校？", py: "Nǐ dú shénme xuéxiào?", de: "Auf welche Schule gehst du?" },
      a: { zh: "我读 Goethe-Gymnasium。", py: "Wǒ dú Goethe-Gymnasium.", de: "Ich besuche das Goethe-Gymnasium." }
    },
    {
      pairId: 6,
      q: { zh: "你喜欢做什么？ / 你很会做什么？", py: "Nǐ xǐhuan / hěn huì zuò shénme?", de: "Was machst du gern / kannst du gut?" },
      a: { zh: "我喜欢听音乐。 / 我很会踢足球。", py: "Wǒ xǐhuan tīng yīnyuè / tī zúqiú.", de: "Ich höre gern Musik / spiele gut Fußball." }
    }
  ];

  let deck = [];
  let flippedCards = [];
  let lockBoard = false;
  let matchedPairs = 0;
  let moves = 0;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initGame() {
    deck = [];
    pairsData.forEach(p => {
      deck.push({ pairId: p.pairId, type: "q", label: "问句 Frage", ...p.q });
      deck.push({ pairId: p.pairId, type: "a", label: "回答 Antwort", ...p.a });
    });
    shuffle(deck);
    flippedCards = [];
    lockBoard = false;
    matchedPairs = 0;
    moves = 0;
    updateStats();
    setMsg("Finde die passenden Paare: Frage (问句) + Antwort (回答)!");

    const grid = document.getElementById("cardGrid");
    grid.innerHTML = "";
    deck.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = `card type-${item.type}`;
      card.dataset.index = idx;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">
            <div class="card-num">${idx + 1}</div>
            <div class="card-sub">W-Fragen</div>
          </div>
          <div class="card-face card-front">
            <span class="role-pill">${item.label}</span>
            <div class="card-zh zh">${item.zh}</div>
            <div class="card-py py" style="display:${showPinyin ? 'block' : 'none'}">${item.py}</div>
            <div class="card-de" style="display:${showGerman ? 'block' : 'none'}">${item.de}</div>
          </div>
        </div>
      `;
      card.onclick = () => onCardClick(card, item);
      grid.appendChild(card);
    });
  }

  function onCardClick(cardEl, item) {
    if (lockBoard) return;
    if (cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;

    cardEl.classList.add("flipped");
    flippedCards.push({ el: cardEl, item });

    if (flippedCards.length === 2) {
      moves++;
      updateStats();
      checkMatch();
    }
  }

  function checkMatch() {
    const [c1, c2] = flippedCards;
    const isMatch = c1.item.pairId === c2.item.pairId && c1.item.type !== c2.item.type;

    if (isMatch) {
      c1.el.classList.add("matched");
      c2.el.classList.add("matched");
      matchedPairs++;
      updateStats();
      flippedCards = [];
      if (matchedPairs === pairsData.length) {
        setMsg("🎉 Super! Alle 6 Paare gefunden! (+1 Punkt für jedes gelesene Paar)", "var(--teal)");
      } else {
        setMsg("✓ Treffer! Lies Frage und Antwort laut vor (+1 Punkt)!", "var(--teal)");
      }
    } else {
      lockBoard = true;
      setMsg("✗ Passt noch nicht — merke dir die Positionen!", "var(--crimson)");
      setTimeout(() => {
        c1.el.classList.remove("flipped");
        c2.el.classList.remove("flipped");
        flippedCards = [];
        lockBoard = false;
      }, 1250);
    }
  }

  function peekAll() {
    if (lockBoard) return;
    lockBoard = true;
    const cards = document.querySelectorAll(".card:not(.matched)");
    cards.forEach(c => c.classList.add("flipped"));
    setMsg("👀 3 Sekunden merken...", "var(--amber)");
    setTimeout(() => {
      cards.forEach(c => {
        if (!flippedCards.some(fc => fc.el === c)) {
          c.classList.remove("flipped");
        }
      });
      lockBoard = false;
      setMsg("Weiter geht's!");
    }, 3000);
  }

  function toggleHint(type) {
    if (type === "pinyin") {
      showPinyin = !showPinyin;
      const btn = document.getElementById("btnPinyin");
      btn.textContent = `Pīnyīn: ${showPinyin ? "AN" : "AUS"}`;
      btn.classList.toggle("on", showPinyin);
      document.querySelectorAll(".card-py").forEach(el => {
        el.style.display = showPinyin ? "block" : "none";
      });
    } else {
      showGerman = !showGerman;
      const btn = document.getElementById("btnGerman");
      btn.textContent = `Deutsch: ${showGerman ? "AN" : "AUS"}`;
      btn.classList.toggle("on", showGerman);
      document.querySelectorAll(".card-de").forEach(el => {
        el.style.display = showGerman ? "block" : "none";
      });
    }
  }

  function updateStats() {
    document.getElementById("pairCount").textContent = `${matchedPairs} / ${pairsData.length}`;
    document.getElementById("moveCount").textContent = moves;
  }

  function setMsg(text, color = "var(--navy)") {
    const el = document.getElementById("statusMsg");
    el.textContent = text;
    el.style.color = color;
  }

  function addScore(idx, delta) {
    scores[idx] = Math.max(0, scores[idx] + delta);
    document.getElementById(`score${idx}`).textContent = scores[idx];
  }

  initGame();
</script>
</body>
</html>
